<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLBB Fearless Draft — Match Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #131d19;
    --bg-panel: #1b2b24;
    --bg-panel-raised: #21362d;
    --line: #2e463c;
    --line-soft: #24382f;
    --amber: #e8b94a;
    --amber-dim: #6b5a2e;
    --teal: #5b8def;
    --teal-dim: #223a5e;
    --crimson: #e4614f;
    --crimson-dim: #452824;
    --text: #ede6d6;
    --text-dim: #9caa9f;
    --text-faint: #5f7268;

    --role-tank: #5b8def;
    --role-fighter: #e4614f;
    --role-assassin: #a970d1;
    --role-mage: #4fb8c9;
    --role-marksman: #e8b94a;
    --role-support: #6fbf73;
    --role-other: #7f8f86;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
  }

  .display{
    font-family: 'Teko', 'Inter', sans-serif;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  #app{ max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }

  /* ---------- Scoreboard header ---------- */
  .scoreboard{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    padding: 22px 28px;
    gap: 18px;
  }
  .team-block{ display:flex; flex-direction:column; gap:4px; }
  .team-block.right{ align-items:flex-end; text-align:right; }
  .team-label{
    font-size:11px; letter-spacing:0.14em; color: var(--text-faint); text-transform:uppercase;
  }
  .team-name-input{
    background:transparent; border:none; color:var(--text);
    font-family:'Teko',sans-serif; font-size:30px; font-weight:600;
    padding:0; width:100%; outline:none;
  }
  .team-block.right .team-name-input{ text-align:right; }
  .team-name-input.a{ color: var(--teal); }
  .team-name-input.b{ color: var(--crimson); }

  .score-center{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .score-nums{ display:flex; align-items:center; gap:14px; font-family:'Teko',sans-serif; }
  .score-num{ font-size:54px; line-height:1; font-weight:600; }
  .score-num.a{ color: var(--teal); }
  .score-num.b{ color: var(--crimson); }
  .score-sep{ font-size:28px; color: var(--text-faint); }
  .format-tag{
    font-size:11px; letter-spacing:0.12em; color: var(--amber);
    border:1px solid var(--amber-dim); padding:3px 10px; text-transform:uppercase;
  }

  /* ---------- Setup panel ---------- */
  .setup{
    background: var(--bg-panel); border:1px solid var(--line);
    padding: 26px 28px; margin-top: 18px;
  }
  .setup h2{
    font-family:'Teko',sans-serif; font-weight:600; font-size:26px; margin:0 0 4px;
  }
  .setup p.sub{ color: var(--text-dim); font-size: 13.5px; margin: 0 0 20px; }
  .field-row{ display:grid; grid-template-columns: 1fr 1fr; gap:18px; margin-bottom:16px; }
  .field-row.single{ grid-template-columns: 1fr; max-width: 320px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:11px; letter-spacing:0.1em; color: var(--text-faint); text-transform:uppercase; }
  .field input, .field select, .field textarea{
    background: var(--bg); border:1px solid var(--line); color: var(--text);
    padding:10px 12px; font-family:'Inter',sans-serif; font-size:14px; outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--amber-dim); }
  .field textarea{ min-height:110px; resize:vertical; line-height:1.5; }
  .field-hint{ font-size:11.5px; color: var(--text-faint); }

  .player-names-title{
    font-family:'Teko',sans-serif; font-weight:600; font-size:19px; margin:22px 0 2px;
    text-transform:uppercase; letter-spacing:0.03em; color: var(--text-dim);
  }
  .player-names-sub{ margin: 0 0 14px; }
  .players-row{ grid-template-columns: 1fr 1fr; align-items:start; }
  .player-col{ display:flex; flex-direction:column; gap:12px; }
  .player-field{ margin-bottom:0; }

  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    padding:11px 20px; border:1px solid var(--amber-dim); background: transparent;
    color: var(--amber); cursor:pointer; letter-spacing:0.02em;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .btn:hover{ background: var(--amber); color:#1b1608; }
  .btn.ghost{ border-color: var(--line); color: var(--text-dim); }
  .btn.ghost:hover{ background: var(--bg-panel-raised); color: var(--text); }
  .btn.teal{ border-color: var(--teal-dim); color: var(--teal); }
  .btn.teal:hover{ background: var(--teal); color:#0a1f19; }
  .btn.crimson{ border-color: var(--crimson-dim); color: var(--crimson); }
  .btn.crimson:hover{ background: var(--crimson); color:#2a120d; }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn:disabled:hover{ background:transparent; color: var(--amber); }

  /* ---------- Game stepper ---------- */
  .stepper{ display:flex; gap:6px; margin-top:18px; }
  .step{
    flex:1; background: var(--bg-panel); border:1px solid var(--line);
    padding:10px 12px; position:relative;
  }
  .step .num{ font-family:'Teko',sans-serif; font-size:22px; font-weight:600; color: var(--text-faint); }
  .step .status{ font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color: var(--text-faint); margin-top:2px; }
  .step.active{ border-color: var(--amber-dim); background: var(--bg-panel-raised); }
  .step.active .num{ color: var(--amber); }
  .step.won-a{ border-color: var(--teal-dim); }
  .step.won-a .num{ color: var(--teal); }
  .step.won-a .status{ color: var(--teal); }
  .step.won-b{ border-color: var(--crimson-dim); }
  .step.won-b .num{ color: var(--crimson); }
  .step.won-b .status{ color: var(--crimson); }
  .step.ultimate{ border-color: var(--amber-dim); }
  .step.ultimate .num{ color: var(--amber); }

  /* ---------- Draft area ---------- */
  .draft-toolbar{
    display:grid; grid-template-columns: 1fr auto 1fr;
    align-items:center; gap:18px;
    background: var(--bg-panel); border:1px solid var(--line); border-top:none;
    padding: 14px 22px; margin-bottom: -1px;
  }
  .toolbar-side{ display:flex; align-items:center; gap:14px; }
  .toolbar-side.right{ justify-content:flex-end; }
  .role-chip-row{ display:flex; gap:5px; }
  .role-chip-row.centered{ justify-content:center; margin-bottom:10px; }
  .role-chip{
    width:24px; height:24px; display:flex; align-items:center; justify-content:center;
    font-family:'Teko',sans-serif; font-size:12px; font-weight:600; color:#111a15;
    cursor:pointer; opacity:0.55; border:1px solid transparent; user-select:none;
    transition: opacity 0.12s ease, border-color 0.12s ease;
  }
  .role-chip:hover{ opacity:0.85; }
  .role-chip.active{ opacity:1; border-color: var(--text); }
  .toolbar-team-name{
    font-family:'Teko',sans-serif; font-weight:600; font-size:22px;
    background:transparent; border:none; outline:none; padding:0;
    letter-spacing:0.04em; text-transform:uppercase; width: 150px;
  }
  .toolbar-team-name.a{ color: var(--teal); }
  .toolbar-team-name.b{ color: var(--crimson); text-align:right; }

  .toolbar-center{ display:flex; flex-direction:column; align-items:center; gap:2px; min-width:180px; }
  .toolbar-count{ font-family:'Teko',sans-serif; font-size:44px; font-weight:600; line-height:1; color: var(--text); }
  .toolbar-turn-label{
    font-size:11px; letter-spacing:0.08em; text-transform:uppercase; padding:2px 10px;
    border:1px solid var(--line); white-space:nowrap;
  }
  .toolbar-turn-label.a{ color: var(--teal); border-color: var(--teal-dim); }
  .toolbar-turn-label.b{ color: var(--crimson); border-color: var(--crimson-dim); }
  .toolbar-turn-label.blind{ color: var(--amber); border-color: var(--amber-dim); }
  .toolbar-turn-label.neutral{ color: var(--text-faint); }

  .toolbar-search-wrap{ position:relative; width:200px; }
  .toolbar-search{
    width:100%; background: var(--bg); border:1px solid var(--line); color: var(--text);
    padding:8px 30px 8px 12px; font-family:'Inter',sans-serif; font-size:13px; outline:none;
  }
  .toolbar-search::placeholder{ color: var(--text-faint); }
  .toolbar-search:focus{ border-color: var(--amber-dim); }
  .toolbar-search-clear{
    position:absolute; right:5px; top:50%; transform:translateY(-50%);
    width:20px; height:20px; display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; color: var(--text-faint); font-size:15px;
    line-height:1; cursor:pointer; padding:0;
  }
  .toolbar-search-clear:hover{ color: var(--text); }

  .ultimate-banner{
    background: var(--bg-panel-raised); border:1px solid var(--amber-dim); border-top:none;
    padding: 10px 20px; font-size:13px; color: var(--amber); margin-bottom:-1px; text-align:center;
  }

  .manual-bar{
    display:flex; justify-content:flex-end;
    background: var(--bg-panel); border:1px solid var(--line); border-top:none;
    padding: 8px 20px; margin-bottom:-1px;
  }
  .manual-toggle{
    background:transparent; border:none; color: var(--text-faint); cursor:pointer;
    font-family:'Inter',sans-serif; font-size:12px; letter-spacing:0.03em; padding:2px 4px;
    transition: color 0.12s ease;
  }
  .manual-toggle:hover{ color: var(--amber); }

  .manual-panel{
    background: var(--bg-panel-raised); border:1px solid var(--amber-dim); border-top:none;
    padding: 16px 20px 18px; margin-bottom:-1px;
  }
  .manual-hint{ font-size:12px; color: var(--text-dim); margin-bottom:12px; line-height:1.4; }
  .manual-row{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  .manual-col{ display:flex; flex-direction:column; gap:6px; }
  .manual-label{ font-size:11px; letter-spacing:0.06em; text-transform:uppercase; }
  .manual-label.a{ color: var(--teal); }
  .manual-label.b{ color: var(--crimson); }
  .manual-textarea{
    background: var(--bg); border:1px solid var(--line); color: var(--text);
    padding:9px 11px; font-family:'Inter',sans-serif; font-size:13px; outline:none;
    min-height:56px; resize:vertical; line-height:1.4;
  }
  .manual-textarea.a{ border-color: var(--teal-dim); }
  .manual-textarea.b{ border-color: var(--crimson-dim); }
  .manual-textarea:focus{ border-color: var(--amber-dim); }
  .manual-error{
    margin-top:12px; font-size:12.5px; color: var(--crimson);
    border:1px solid var(--crimson-dim); background: var(--crimson-dim);
    padding:8px 12px;
  }
  .manual-actions{ display:flex; gap:10px; margin-top:14px; }

  .draft-grid{
    display:grid; grid-template-columns: 320px minmax(0,1fr) 320px; gap:0;
    border:1px solid var(--line); background: var(--bg-panel);
  }
  .roster{ padding: 14px 10px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  .roster:last-child{ border-right:none; border-left:1px solid var(--line); }
  .roster h3{
    font-family:'Teko',sans-serif; font-size:14px; font-weight:600; margin:0 0 2px;
    text-transform:uppercase; letter-spacing:0.02em; text-align:center;
    line-height:1.15; word-break:break-word;
  }
  .roster.a h3{ color: var(--teal); }
  .roster.b h3{ color: var(--crimson); }
  .slot{
    border:1px dashed var(--line); padding:6px; font-size:13px; color: var(--text-faint);
    display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; min-height:0;
  }
  .slot.filled{ border-style:solid; background: var(--bg); }
  .roster.a .slot.filled{ border-color: var(--teal-dim); }
  .roster.b .slot.filled{ border-color: var(--crimson-dim); }
  .slot.filled{ position:relative; width:100%; height:auto; min-height:0; padding:0; gap:2px; background:transparent; }

  .slot-player-input{
    display:none; background:transparent; border:none; outline:none; padding:0; margin:0;
    font-family:'Inter',sans-serif; font-size:9.5px; letter-spacing:0.04em; text-transform:uppercase;
    color: var(--text-faint); width:100%; text-align:center;
  }
  .roster.a .slot-player-input{ color: var(--teal); }
  .roster.b .slot-player-input{ color: var(--crimson); }
  .slot-player-input::placeholder{ color: inherit; opacity:0.65; }
  .slot-player-input:focus{ color: var(--text); }

  .slot-hero{ font-size:10px; color: var(--text); text-align:center; line-height:1.2; }
  .slot-hero.empty{ color: var(--text-faint); font-style:italic; }

  .slot-wallpaper{
    width:min(300px, 100%); max-width:100%; height:80px; aspect-ratio:auto; position:relative; overflow:hidden; border-radius:4px;
    background:var(--bg-panel-raised); display:flex; align-items:flex-end;
  }
  .slot-wallpaper img.wallpaper-image{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; display:block; }
  .slot-wallpaper::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.05) 25%, rgba(0,0,0,0.88) 100%); pointer-events:none; }
  .slot-wallpaper.fallback::after{ display:none; }
  .slot-wallpaper .hero-avatar{ position:absolute; inset:0; width:100%; height:100%; border-radius:inherit; }
  .slot-wallpaper-caption{ position:absolute; left:0; right:0; bottom:0; z-index:2; width:100%; padding:8px 10px 7px; background:linear-gradient(transparent, rgba(0,0,0,0.85)); color:var(--text); font-size:11px; line-height:1.15; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .recent-heroes{ width:100%; display:flex; justify-content:flex-start; gap:5px; min-height:28px; padding:2px 2px 0; }
  .recent-hero-icon{ width:26px; height:26px; border-radius:4px; object-fit:cover; display:block; border:1px solid var(--line); }
  .slot-tile-avatar{ width:48px; height:48px; border-radius:6px; }
  .slot-tile-empty{
    width:48px; height:48px; border-radius:6px; border:1px dashed var(--line);
    background: var(--bg);
  }

  .pool{ padding: 12px 14px; }
  .pool-head{ display:flex; align-items:center; justify-content:center; margin-bottom:10px; }
  .pool-count{ font-size:11.5px; color: var(--text-faint); letter-spacing:0.04em; }

  .game-pick-history{
    background:var(--bg-panel); border:1px solid var(--line); padding:10px 14px; margin-bottom:8px;
  }
  .game-history{
    display:flex; flex-direction:row; gap:12px; align-items:flex-start;
    overflow-x:auto; overflow-y:hidden; padding-bottom:3px;
  }
  .game-history-card{
    flex:0 0 auto; width:178px; padding:8px 9px;
    background:var(--bg); border:1px solid var(--line); border-radius:4px;
  }
  .game-pick-history-title{
    font-family:'Teko',sans-serif; font-size:16px; color:var(--amber);
    text-transform:uppercase; letter-spacing:0.04em; text-align:center; margin-bottom:7px;
  }
  .game-pick-history-section + .game-pick-history-section{ margin-top:8px; }
  .game-pick-history-label{
    color:var(--text-faint); font-size:9px; letter-spacing:0.1em;
    text-transform:uppercase; margin-bottom:3px;
  }
  .game-pick-history-row{
    display:flex; flex-wrap:wrap; gap:5px; min-width:0; overflow:hidden;
  }
  .game-history-card .game-pick-history-section + .game-pick-history-section{ margin-top:10px; }
  .game-history-icon{ display:block; object-fit:cover; flex:0 0 auto; border:1px solid var(--line); }
  .current-game-hero{ width:64px; height:64px; border-radius:6px; }
  .previous-game-hero{ width:28px; height:28px; border-radius:4px; opacity:0.82; }

  .filter-row{ }
  .filter-row-label{
    font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color: var(--text-faint);
    margin-bottom:4px; text-align:center;
  }
  .filter-row-inner{ display:flex; justify-content:center; gap:10px; margin-bottom: 10px; }
  .filter-select{
    font-family:'Inter',sans-serif; font-size:12px; font-weight:500;
    padding:6px 26px 6px 10px; border:1px solid var(--line); background: var(--bg);
    color: var(--text-dim); cursor:pointer; outline:none; appearance:none; -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0L5 6L10 0Z' fill='%239caa9f'/></svg>");
    background-repeat:no-repeat; background-position: right 10px center;
    transition: border-color 0.12s ease;
  }
  .filter-select:hover{ border-color: var(--amber-dim); }
  .filter-select:focus{ border-color: var(--amber-dim); }
  .filter-select.active{ border-color: var(--amber-dim); color: var(--amber); }

  .hero-scroll{
    max-height: 460px; overflow-y:auto; padding-right:4px;
  }
  .hero-scroll::-webkit-scrollbar{ width:10px; }
  .hero-scroll::-webkit-scrollbar-thumb{ background: var(--line); }

  .hero-empty{ font-size:13px; color: var(--text-faint); padding: 10px 2px; text-align:center; }

  .hero-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(58px,1fr)); gap:6px;
  }

  .hero-card{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:pointer; color: var(--text); user-select:none;
    transition: transform 0.1s ease, opacity 0.12s ease;
  }
  .hero-card:hover{ transform: translateY(-2px); }
  .hero-card.unavailable{
    color: var(--text-faint); cursor:not-allowed; opacity:0.4;
  }
  .hero-card.unavailable:hover{ transform:none; }
  .hero-card.unavailable .hero-name{ text-decoration: line-through; }
  .hero-card.unavailable .hero-avatar{ filter: grayscale(1); }
  .hero-card.picked-mirror{ box-shadow: 0 0 0 2px var(--amber); }
  .hero-card.picked-mirror .hero-name{ color: var(--amber); }

  .hero-avatar{
    width:100%; aspect-ratio:1; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Teko',sans-serif; font-weight:600; font-size:19px; letter-spacing:0.02em;
    color:#111a15; background:transparent !important; flex-shrink:0; position:relative; overflow:hidden;
  }
  .hero-avatar .avatar-initials{ position:absolute; }
  .hero-avatar img{ display:block; width:100%; height:100%; object-fit:cover; border-radius:inherit; position:relative; z-index:1; }
  .hero-name{ line-height:1.15; font-size:9.5px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; }

  /* ---------- Result / footer controls ---------- */
  .result-bar{
    display:flex; flex-direction:column; align-items:center; gap:12px;
    border:1px solid var(--line); border-top:none; background: var(--bg-panel);
    padding: 20px 20px;
  }
  .result-bar .msg{ font-size:13px; color: var(--text-dim); text-align:center; }
  .result-actions{ display:flex; gap:12px; }
  .btn.next-game{
    font-family:'Teko',sans-serif; font-size:18px; font-weight:600; letter-spacing:0.04em;
    text-transform:uppercase; padding:10px 34px; border-radius:20px;
    border:1px solid var(--amber); background: var(--amber); color:#1b1608;
  }
  .btn.next-game:hover{ background:#f4ca6b; }
  .btn.next-game.b{ border-color: var(--crimson); background: var(--crimson); color:#2a120d; }
  .btn.next-game.b:hover{ background:#ea7c6c; }

  .unavailable-strip{
    margin-top: 18px; border:1px solid var(--line); background: var(--bg-panel); padding:16px 20px;
  }
  .unavailable-strip h4{
    font-family:'Teko',sans-serif; font-size:18px; font-weight:600; margin:0 0 10px;
    color: var(--text-dim); text-transform:uppercase; letter-spacing:0.03em;
  }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .locked-hero-icon{ width:32px; height:32px; border:1px solid var(--line-soft); border-radius:4px; object-fit:cover; display:block; }
  .chip{
    font-size:11.5px; padding:4px 9px; border:1px solid var(--line-soft); color: var(--text-faint);
  }

  /* ---------- Match over ---------- */
  .winner-banner{
    margin-top:18px; border:1px solid var(--amber-dim); background: var(--bg-panel-raised);
    padding: 40px 28px; text-align:center;
  }
  .winner-banner .eyebrow{ font-size:12px; letter-spacing:0.16em; color: var(--text-faint); text-transform:uppercase; }
  .winner-banner .name{ font-family:'Teko',sans-serif; font-size:56px; font-weight:600; color: var(--amber); margin:6px 0; }
  .winner-banner .final{ font-size:14px; color: var(--text-dim); }

  .hidden{ display:none !important; }

  @media (max-width: 820px){
    .scoreboard{ grid-template-columns: 1fr; text-align:center; }
    .team-block.right{ align-items:center; text-align:center; }
    .draft-grid{ grid-template-columns: 1fr; }
    .roster{ border-right:none !important; border-left:none !important; border-bottom:1px solid var(--line); flex-direction:column; align-items:center; justify-content:flex-start; }
    .roster h3{ flex-basis:auto; }

    "Gold Lane": ["Beatrix","Brody","Bruno","Claude","Clint","Hanabi","Harith","Irithel","Ixia","Karrie","Kimmy","Layla","Lesley","Melissa","Miya","Moskov","Natan","Obsidia","Popol and Kupa","Roger","Wanwan"],
    "Mid Lane": ["Alice","Aurora","Cecilion","Chang'e","Cyclops","Esmeralda","Eudora","Faramis","Gord","Harith","Harley","Julian","Kadita","Kagura","Kimmy","Lunox","Luo Yi","Lylia","Nana","Novaria","Odette","Pharsa","Selena","Vale","Valir","Valentina","Vexana","Xavier","Yve","Zetian","Zhask","Zhuxin"],
    "Roam": ["Akai","Angela","Atlas","Badang","Baxia","Belerick","Carmilla","Chip","Chou","Diggie","Edith","Estes","Faramis","Floryn","Franco","Gatotkaca","Gloo","Grock","Helcurt","Hilda","Hylos","Jawhead","Johnson","Kaja","Kalea","Khaleed","Khufra","Lolita","Marcel","Mathilda","Minotaur","Minsitthar","Natalia","Rafaela","Saber","Selena","Tigreal"],

  };

  function buildReverseMap(groups, order){
    var map = {};
    order.forEach(function(key){
      (groups[key] || []).forEach(function(hero){
        if(!map[hero]) map[hero] = [];
        map[hero].push(key);
      });
    });
    return map;
  }

  var HERO_ROLES = buildReverseMap(ROLE_GROUPS, ROLE_ORDER);
  var HERO_LANES = buildReverseMap(LANE_GROUPS, LANE_ORDER);

  function heroRoles(name){
    return HERO_ROLES[name] || ["Other"];
  }
  function heroLanes(name){
    return HERO_LANES[name] || ["Unassigned"];
  }
  function heroPrimaryRole(name){
    return heroRoles(name)[0];
  }

  function normalizeHeroKey(s){
    return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  var HERO_LOOKUP = {};
  DEFAULT_HEROES.forEach(function(name){
    HERO_LOOKUP[normalizeHeroKey(name)] = name;
  });

  function levenshtein(a, b){
    var m = a.length, n = b.length;
    if(m === 0) return n;
    if(n === 0) return m;
    var prev = new Array(n + 1);
    var cur = new Array(n + 1);
    for(var j = 0; j <= n; j++) prev[j] = j;
    for(var i = 1; i <= m; i++){
      cur[0] = i;
      for(var k = 1; k <= n; k++){
        var cost = a[i-1] === b[k-1] ? 0 : 1;
        cur[k] = Math.min(cur[k-1] + 1, prev[k] + 1, prev[k-1] + cost);
      }
      for(var z = 0; z <= n; z++) prev[z] = cur[z];
    }
    return prev[n];
  }

  // Resolve loosely-typed hero names ("louyi", "changye", "yisunshin") to the
  // canonical hero name, tolerating small typos via edit-distance fallback.
  function resolveHeroName(raw){
    var key = normalizeHeroKey(raw);
    if(!key) return null;
    if(HERO_LOOKUP[key]) return HERO_LOOKUP[key];
    var best = null, bestDist = Infinity, tie = false;
    Object.keys(HERO_LOOKUP).forEach(function(k){
      var d = levenshtein(key, k);
      if(d < bestDist){ bestDist = d; best = HERO_LOOKUP[k]; tie = false; }
      else if(d === bestDist && HERO_LOOKUP[k] !== best){ tie = true; }
    });
    if(best && bestDist <= 2 && !tie) return best;
    return null;
  }

  var ROLE_COLORS = {
    "Tank": "var(--role-tank)",
    "Fighter": "var(--role-fighter)",
    "Assassin": "var(--role-assassin)",
    "Mage": "var(--role-mage)",
    "Marksman": "var(--role-marksman)",
    "Support": "var(--role-support)",
    "Other": "var(--role-other)"
  };

  var STOPWORDS = { "and": true, "of": true, "the": true };

  function heroInitials(name){
    var words = name.replace(/[^A-Za-z' -]/g, " ").split(/[\s-]+/).filter(function(w){
      return w && !STOPWORDS[w.toLowerCase()];
    });
    if(words.length === 0) return "?";
    if(words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[words.length - 1][0]).toUpperCase();
  }

  function buildHeroAvatar(name, size){
    var avatar = el("div", "hero-avatar");
    avatar.appendChild(el("span", "avatar-initials", heroInitials(name)));
    avatar.style.background = ROLE_COLORS[heroPrimaryRole(name)] || ROLE_COLORS.Other;
    if(size){ avatar.style.width = size + "px"; avatar.style.height = size + "px"; avatar.style.fontSize = Math.round(size * 0.4) + "px"; }
    if(HERO_ICONS[name]){
      var icon = document.createElement("img");
      icon.src = HERO_ICONS[name];
      icon.alt = name;
      icon.onerror = function(){ this.remove(); };
      avatar.appendChild(icon);
    }
    return avatar;
  }

  var state = null;


  function freshState(){
    return {
      phase: "setup",              // setup | drafting | result | over
      format: "bo3",
      picksPerTeam: 5,
      teamA: "Blue Team",
      teamB: "Red Team",
      playersA: ["", "", "", "", ""],
      playersB: ["", "", "", "", ""],
      recentHeroesA: [[], [], [], [], []],
      recentHeroesB: [[], [], [], [], []],
      pool: DEFAULT_HEROES.slice(),
      unavailable: {},             // heroName -> true (persists across games, cleared on ultimate)
      games: [],                   // {n, picksA:[], picksB:[], winner:null, ultimate:bool}
      gameHistory: [],             // completed game pick snapshots for the visual history
      currentGame: null,
      score: { a: 0, b: 0 },
      turn: "a",
      heroSearch: "",
      roleFilter: null,
      laneFilter: null,
      manualPanelOpen: false,
      manualError: null
    };
  }

  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }

  function isUltimateGame(n){
    return state.format === "bo7" && n === 7;
  }

  // MLBB-style draft order: 1 pick, then 2-2-2-2, then 1 — alternating sides.
  // Blue: B1, then B2 B3, then B4 B5  |  Red: R1 R2, then R3 R4, then R5
  function buildTurnOrder(perTeam){
    if(perTeam === 5){
      return ["a","b","b","a","a","b","b","a","a","b"];
    }
    // fallback for non-standard pick counts: simple strict alternation
    var order = [];
    for(var i=0;i<perTeam*2;i++){ order.push(i % 2 === 0 ? "a" : "b"); }
    return order;
  }

  var PICK_ORDINAL = ["1st","2nd","3rd","4th","5th","6th","7th","8th","9th","10th"];

  function playerName(side, i){
    var arr = side === "a" ? state.playersA : state.playersB;
    var val = arr && arr[i] ? arr[i].trim() : "";
    return val || ((side === "a" ? "Blue " : "Red ") + "Player " + (i + 1));
  }

  function recordRecentHero(side, playerIndex, heroName){
    var histories = side === "a" ? state.recentHeroesA : state.recentHeroesB;
    var history = histories[playerIndex] || [];
    histories[playerIndex] = [heroName].concat(history.filter(function(name){ return name !== heroName; })).slice(0, 5);
  }

  function heroWallpaperPath(name){
    return HERO_WALLPAPERS[name] || null;
  }

  function buildGameHistoryIcon(name, className){
    if(!HERO_ICONS[name]) return null;
    var icon = document.createElement("img");
    icon.className = "game-history-icon " + className;
    icon.src = HERO_ICONS[name];
    icon.alt = name;
    icon.title = name;
    icon.onerror = function(){ this.remove(); };
    return icon;
  }

  function buildGameHistoryRow(label, names, iconClass){
    var section = el("div", "game-pick-history-section");
    section.appendChild(el("div", "game-pick-history-label", label));
    var row = el("div", "game-pick-history-row");
    (names || []).forEach(function(name){
      var icon = buildGameHistoryIcon(name, iconClass);
      if(icon) row.appendChild(icon);
    });

    return section;
  }

  function buildGamePickHistory(game){
    var wrap = el("div", "game-pick-history");
    wrap.appendChild(el("div", "game-pick-history-title", "Game " + game.n + " — Current game"));
    wrap.appendChild(buildGameHistoryRow("Blue", game.picksA, "current-game-hero"));
    wrap.appendChild(buildGameHistoryRow("Red", game.picksB, "current-game-hero"));

    if(state.gameHistory.length){
      wrap.appendChild(el("div", "game-pick-history-title", "Previous games"));
      var history = el("div", "game-history");
      state.gameHistory.forEach(function(previous){
        var card = el("div", "game-history-card");
        card.appendChild(el("div", "game-pick-history-label", "Game " + previous.game));
        card.appendChild(buildGameHistoryRow("Blue", previous.blue, "previous-game-hero"));
        card.appendChild(buildGameHistoryRow("Red", previous.red, "previous-game-hero"));
        history.appendChild(card);
      });
      wrap.appendChild(history);
    }

  }

  function buildRosterSlot(side, i, heroName){
    var slot = el("div", "slot" + (heroName ? " filled" : ""));

    if(heroName){
      var wallpaper = el("div", "slot-wallpaper");
      var wallpaperPath = heroWallpaperPath(heroName);
      if(wallpaperPath){
        var wallpaperImage = document.createElement("img");
        wallpaperImage.className = "wallpaper-image";
        wallpaperImage.src = wallpaperPath;
        wallpaperImage.alt = heroName;
        wallpaperImage.style.objectPosition = HERO_WALLPAPER_POSITION[heroName] || "center center";
        wallpaperImage.onerror = function(){
          this.remove();
          wallpaper.classList.add("fallback");
          wallpaper.appendChild(buildHeroAvatar(heroName));
        };
        wallpaper.appendChild(wallpaperImage);
      } else {
        wallpaper.classList.add("fallback");
        wallpaper.appendChild(buildHeroAvatar(heroName));
      }
      wallpaper.appendChild(el("div", "slot-wallpaper-caption", playerName(side, i) + " — " + heroName));
      slot.appendChild(wallpaper);
    } else {
      slot.appendChild(el("div", "slot-tile-empty"));
      slot.appendChild(el("div", "slot-hero empty", "\u2014"));
    }

    var nameInput = el("input", "slot-player-input");
    nameInput.value = (side === "a" ? state.playersA : state.playersB)[i] || "";
    nameInput.placeholder = (side === "a" ? "Blue " : "Red ") + "P" + (i + 1);
    nameInput.onchange = function(){
      var arr = side === "a" ? state.playersA : state.playersB;
      arr[i] = this.value;
      render();
    };
    slot.appendChild(nameInput);

    return slot;
  }

  function startMatch(cfg){
    state.format = cfg.format;
    state.teamA = cfg.teamA || "Team A";
    state.teamB = cfg.teamB || "Team B";
    state.playersA = cfg.playersA || ["", "", "", "", ""];
    state.playersB = cfg.playersB || ["", "", "", "", ""];
    state.pool = cfg.pool;
    state.unavailable = {};
    state.games = [];
    state.score = { a:0, b:0 };
    state.phase = "drafting";
    beginGame(1);
  }

  function beginGame(n){
    var ultimate = isUltimateGame(n);
    state.currentGame = { n: n, picksA: [], picksB: [], winner: null, ultimate: ultimate, historyRecorded: false };
    state.turn = ultimate ? "a" : buildTurnOrder(state.picksPerTeam)[0];
    state.phase = "drafting";
    state.manualPanelOpen = false;
    state.manualError = null;
  }

  function checkGameComplete(){
    var g = state.currentGame;
    if(!g || g.historyRecorded) return false;
    var blueComplete = g.picksA.length === state.picksPerTeam && g.picksA.every(function(name){ return !!name; });
    var redComplete = g.picksB.length === state.picksPerTeam && g.picksB.every(function(name){ return !!name; });
    if(!blueComplete || !redComplete) return false;

    state.gameHistory.push({
      game: g.n,
      blue: g.picksA.slice(),
      red: g.picksB.slice()
    });
    g.historyRecorded = true;
    return true;
  }

  function heroUnavailable(name){
    if(state.currentGame && state.currentGame.ultimate) return false; // mirror allowed, reset
    return !!state.unavailable[name];
  }

  function pickHero(name){
    var g = state.currentGame;
    if(!g) return;
    var perTeam = state.picksPerTeam;
    var selectedSide;
    var selectedPlayerIndex;

    if(g.ultimate){
      // Blind pick: fill whichever side still needs heroes, alternate for UI clarity
      if(g.picksA.length <= g.picksB.length && g.picksA.length < perTeam){
        selectedSide = "a";
        selectedPlayerIndex = g.picksA.length;
        g.picksA.push(name);
      } else if(g.picksB.length < perTeam){
        selectedSide = "b";
        selectedPlayerIndex = g.picksB.length;
        g.picksB.push(name);
      }
    } else {
      if(heroUnavailable(name)) return;
      var order = buildTurnOrder(perTeam);
      var picksSoFar = g.picksA.length + g.picksB.length;
      if(picksSoFar >= perTeam*2) return;
      var side = order[picksSoFar];
      if(side === "a"){
        selectedSide = "a";
        selectedPlayerIndex = g.picksA.length;
        g.picksA.push(name);
      } else {
        selectedSide = "b";
        selectedPlayerIndex = g.picksB.length;
        g.picksB.push(name);
      }
      state.unavailable[name] = true;
      picksSoFar++;
      state.turn = picksSoFar < perTeam*2 ? order[picksSoFar] : null;
    }

    if(selectedSide) recordRecentHero(selectedSide, selectedPlayerIndex, name);

    checkGameComplete();
    if(g.picksA.length >= perTeam && g.picksB.length >= perTeam){
      state.phase = "result";
    }
    render();
  }

  // Bulk-fill a game's picks from pasted/typed hero name lists, e.g. for
  // catching the tracker up on a match already played elsewhere. Validates
  // everything first and applies nothing if any name fails to resolve.
  function applyManualPicks(rawA, rawB){
    var g = state.currentGame;
    if(!g) return;
    var perTeam = state.picksPerTeam;

    function parseList(raw){
      return String(raw || "").split(",").map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0; });
    }

    var listA = parseList(rawA);
    var listB = parseList(rawB);

    if(listA.length === 0 && listB.length === 0){
      state.manualError = "Enter at least one hero name for a team.";
      render();
      return;
    }
    if(listA.length > perTeam || listB.length > perTeam){
      state.manualError = "Each team can have at most " + perTeam + " picks.";
      render();
      return;
    }

    var unresolved = [];
    var resolvedA = listA.map(function(n){
      var r = resolveHeroName(n);
      if(!r) unresolved.push(n);
      return r;
    });
    var resolvedB = listB.map(function(n){
      var r = resolveHeroName(n);
      if(!r) unresolved.push(n);
      return r;
    });

    if(unresolved.length > 0){
      state.manualError = "Couldn't match: " + unresolved.join(", ");
      render();
      return;
    }

    var combined = resolvedA.concat(resolvedB);
    var seen = {};
    var dupes = [];
    combined.forEach(function(name){
      if(seen[name]) dupes.push(name); else seen[name] = true;
    });
    if(dupes.length > 0 && !g.ultimate){
      state.manualError = "Duplicate pick" + (dupes.length > 1 ? "s" : "") + ": " + dupes.join(", ") + " (mirror picks only allowed in the Ultimate Battle game).";
      render();
      return;
    }

    if(!g.ultimate){
      var alreadyLocked = combined.filter(function(name){ return state.unavailable[name]; });
      if(alreadyLocked.length > 0){
        state.manualError = "Already locked from an earlier game: " + alreadyLocked.join(", ");
        render();
        return;
      }
    }

    g.picksA = resolvedA;
    g.picksB = resolvedB;
    resolvedA.forEach(function(name, index){ recordRecentHero("a", index, name); });
    resolvedB.forEach(function(name, index){ recordRecentHero("b", index, name); });
    checkGameComplete();
    if(!g.ultimate){
      combined.forEach(function(name){ state.unavailable[name] = true; });
    }

    var total = g.picksA.length + g.picksB.length;
    if(g.picksA.length >= perTeam && g.picksB.length >= perTeam){
      state.phase = "result";
      state.turn = null;
    } else if(!g.ultimate){
      var order = buildTurnOrder(perTeam);
      state.turn = total < perTeam*2 ? order[total] : null;
    }

    state.manualError = null;
    state.manualPanelOpen = false;
    render();
  }

  function declareWinner(side){
    var g = state.currentGame;
    g.winner = side;
    if(side === "a") state.score.a++; else state.score.b++;
    state.games.push(g);

    var fmt = FORMATS[state.format];
    if(state.score.a >= fmt.majority || state.score.b >= fmt.majority){
      state.phase = "over";
      state.currentGame = null;
      render();
      return;
    }

    var nextN = g.n + 1;
    if(nextN > fmt.games){
      // shouldn't happen given majority check, but guard anyway
      state.phase = "over";
      state.currentGame = null;
      render();
      return;
    }
    beginGame(nextN);
    render();
  }

  function resetAll(){
    state = freshState();
    render();
  }

  /* ---------------- Rendering ---------------- */

  function render(){
    var app = document.getElementById("app");
    app.innerHTML = "";

    if(state.phase === "setup"){
      app.appendChild(renderSetup());
      return;
    }

    app.appendChild(renderScoreboard());
    app.appendChild(renderStepper());

    if(state.phase === "over"){
      app.appendChild(renderWinnerBanner());
    } else {
      app.appendChild(renderDraftArea());
    }

    app.appendChild(renderUnavailableStrip());

    var footer = el("div", "", "");
    footer.style.marginTop = "18px";
    footer.style.textAlign = "right";
    var resetBtn = el("button", "btn ghost", "Reset match");
    resetBtn.onclick = resetAll;
    footer.appendChild(resetBtn);
    app.appendChild(footer);
  }

  function renderStepper(){
    var wrap = el("div", "stepper");
    var fmt = FORMATS[state.format];
    for(var i=1; i<=fmt.games; i++){
      var played = state.games.filter(function(g){ return g.n === i; })[0];
      var isCurrent = state.currentGame && state.currentGame.n === i;
      var cls = "step";
      var statusText = "Pending";
      if(played){
        cls += played.winner === "a" ? " won-a" : " won-b";
        statusText = (played.winner === "a" ? state.teamA : state.teamB) + " won";
      } else if(isCurrent){
        cls += " active";
        statusText = state.phase === "result" ? "Awaiting result" : "Drafting";
      }
      if(isUltimateGame(i)) cls += " ultimate";
      var step = el("div", cls);
      step.appendChild(el("div", "num", "G" + i));
      step.appendChild(el("div", "status", isUltimateGame(i) && !played ? "Ultimate battle" : statusText));
      wrap.appendChild(step);
    }
    return wrap;
  }

  var ROLE_CHIP_LETTERS = { "Tank":"T", "Fighter":"F", "Assassin":"A", "Mage":"M", "Marksman":"G", "Support":"S" };

  function renderDraftArea(){
    var container = document.createDocumentFragment ? el("div","") : el("div","");
    var g = state.currentGame;
    var availableCount = state.pool.filter(function(h){ return g.ultimate || !state.unavailable[h]; }).length;

    var toolbar = el("div", "draft-toolbar");

    var leftSide = el("div", "toolbar-side");
    var nameA = el("input", "toolbar-team-name a");
    nameA.value = state.teamA;
    nameA.onchange = function(){ state.teamA = this.value || "Blue Team"; render(); };
    leftSide.appendChild(nameA);
    toolbar.appendChild(leftSide);

    var center = el("div", "toolbar-center");
    center.appendChild(el("div", "toolbar-count", String(availableCount)));
    var turnCls = "toolbar-turn-label";
    var turnText;
    if(state.phase === "drafting"){
      if(g.ultimate){
        turnCls += " blind"; turnText = "Blind pick · mirror ok";
      } else {
        var picksSoFar = g.picksA.length + g.picksB.length;
        var ordinal = PICK_ORDINAL[picksSoFar] || (picksSoFar+1) + "th";
        turnCls += " " + state.turn;
        turnText = ordinal + " pick — " + (state.turn === "a" ? state.teamA : state.teamB);
      }
    } else {
      turnCls += " neutral"; turnText = "Picks complete";
    }
    center.appendChild(el("div", turnCls, turnText));
    toolbar.appendChild(center);

    var rightSide = el("div", "toolbar-side right");
    var searchWrap = el("div", "toolbar-search-wrap");
    var searchInput = el("input");
    searchInput.type = "text";
    searchInput.className = "toolbar-search";
    searchInput.placeholder = "Search Hero...";
    searchInput.value = state.heroSearch || "";
    searchWrap.appendChild(searchInput);
    var clearBtn = el("button", "toolbar-search-clear", "\u00D7");
    clearBtn.type = "button";
    clearBtn.setAttribute("aria-label", "Clear search");
    if(!state.heroSearch) clearBtn.classList.add("hidden");
    searchWrap.appendChild(clearBtn);
    rightSide.appendChild(searchWrap);
    var nameB = el("input", "toolbar-team-name b");
    nameB.value = state.teamB;
    nameB.onchange = function(){ state.teamB = this.value || "Red Team"; render(); };
    rightSide.appendChild(nameB);
    toolbar.appendChild(rightSide);

    container.appendChild(toolbar);

    var manualBar = el("div", "manual-bar");
    var manualToggle = el("button", "manual-toggle", state.manualPanelOpen ? "\u2715 Close manual entry" : "\u270E Enter picks manually");
    manualToggle.type = "button";
    manualToggle.onclick = function(){
      state.manualPanelOpen = !state.manualPanelOpen;
      state.manualError = null;
      render();
    };
    manualBar.appendChild(manualToggle);
    container.appendChild(manualBar);

    if(state.manualPanelOpen){
      var panel = el("div", "manual-panel");
      panel.appendChild(el("div", "manual-hint",
        "Paste or type each team's picks as a comma-separated list, in any order. Use this to catch the tracker up on a game that was already drafted elsewhere."));

      var manualRow = el("div", "manual-row");

      var colA = el("div", "manual-col");
      colA.appendChild(el("label", "manual-label a", state.teamA + " picks"));
      var taA = el("textarea", "manual-textarea a");
      taA.placeholder = "e.g. Layla, Miya, Aldous, Aamon, Harith";
      taA.value = g.picksA.length ? g.picksA.join(", ") : "";
      colA.appendChild(taA);
      manualRow.appendChild(colA);

      var colB = el("div", "manual-col");
      colB.appendChild(el("label", "manual-label b", state.teamB + " picks"));
      var taB = el("textarea", "manual-textarea b");
      taB.placeholder = "e.g. Selena, Esmeralda, Brody, Suyou, Luo Yi";
      taB.value = g.picksB.length ? g.picksB.join(", ") : "";
      colB.appendChild(taB);
      manualRow.appendChild(colB);

      panel.appendChild(manualRow);

      if(state.manualError){
        panel.appendChild(el("div", "manual-error", state.manualError));
      }

      var manualActions = el("div", "manual-actions");
      var applyBtn = el("button", "btn", "Apply picks");
      applyBtn.onclick = function(){ applyManualPicks(taA.value, taB.value); };
      manualActions.appendChild(applyBtn);
      var cancelBtn = el("button", "btn ghost", "Cancel");
      cancelBtn.onclick = function(){ state.manualPanelOpen = false; state.manualError = null; render(); };
      manualActions.appendChild(cancelBtn);
      panel.appendChild(manualActions);

      container.appendChild(panel);
    }

    if(g.ultimate){
      var banner = el("div", "ultimate-banner",
        "All heroes are available again. No bans. Selections are blind — teams pick independently and the same hero may appear on both sides.");
      container.appendChild(banner);
    }

    container.appendChild(buildGamePickHistory(g));

    var grid = el("div", "draft-grid");

    var rosterA = el("div", "roster a");
    rosterA.appendChild(el("h3", "", state.teamA));
    for(var i=0;i<state.picksPerTeam;i++){
      rosterA.appendChild(buildRosterSlot("a", i, g.picksA[i]));
    }
    grid.appendChild(rosterA);

    var poolWrap = el("div", "pool");
    var poolHead = el("div", "pool-head");
    poolHead.appendChild(el("div", "pool-count", availableCount + " / " + state.pool.length + " available"));
    poolWrap.appendChild(poolHead);

    function buildHeroScroll(){
      var query = (state.heroSearch || "").trim().toLowerCase();
      var visibleNames = state.pool.filter(function(name){
        if(query && name.toLowerCase().indexOf(query) === -1) return false;
        if(state.roleFilter && heroRoles(name).indexOf(state.roleFilter) === -1) return false;
        if(state.laneFilter && heroLanes(name).indexOf(state.laneFilter) === -1) return false;
        return true;
      });

      var scroll = el("div", "hero-scroll");

      function buildCard(name){
        var unavailable = heroUnavailable(name);
        var isMirror = g.ultimate && (g.picksA.indexOf(name) !== -1) && (g.picksB.indexOf(name) !== -1);
        var cls = "hero-card" + (unavailable ? " unavailable" : "") + (isMirror ? " picked-mirror" : "");
        var card = el("div", cls);
        card.appendChild(buildHeroAvatar(name));
        card.appendChild(el("div", "hero-name", name));
        if(!unavailable && state.phase === "drafting"){
          card.onclick = function(n){ return function(){ pickHero(n); }; }(name);
        }
        return card;
      }

      if(visibleNames.length === 0){
        scroll.appendChild(el("div", "hero-empty", "No heroes match your filters."));
        return scroll;
      }

      // Single continuous grid — no role-section grouping, matching the
      // fearless-draft champ-select look.
      var heroGrid = el("div", "hero-grid");
      visibleNames.forEach(function(name){
        heroGrid.appendChild(buildCard(name));
      });
      scroll.appendChild(heroGrid);
      return scroll;
    }

    function buildFilterDropdown(label, options, activeValue, onPick){
      var row = el("div", "filter-row");
      row.appendChild(el("div", "filter-row-label", label));
      var select = el("select", "filter-select" + (activeValue ? " active" : ""));
      var allOpt = el("option", "", "All " + label + "s");
      allOpt.value = "";
      select.appendChild(allOpt);
      options.forEach(function(opt){
        var o = el("option", "", opt);
        o.value = opt;
        if(activeValue === opt) o.selected = true;
        select.appendChild(o);
      });
      select.onchange = function(){ onPick(this.value || null); };
      row.appendChild(select);
      return row;
    }

    var chipRow = el("div", "role-chip-row centered");
    ["Tank","Fighter","Assassin","Mage","Marksman","Support"].forEach(function(role){
      var chip = el("div", "role-chip" + (state.roleFilter === role ? " active" : ""), ROLE_CHIP_LETTERS[role]);
      chip.style.background = ROLE_COLORS[role];
      chip.title = role;
      chip.onclick = function(r){ return function(){
        state.roleFilter = (state.roleFilter === r) ? null : r;
        render();
      }; }(role);
      chipRow.appendChild(chip);
    });
    poolWrap.appendChild(chipRow);

    var filterRowInner = el("div", "filter-row-inner");
    var laneFilterRow = buildFilterDropdown("Lane", ["EXP Lane","Gold Lane","Mid Lane","Roam","Jungle"], state.laneFilter, function(val){
      state.laneFilter = val;
      render();
    });
    filterRowInner.appendChild(laneFilterRow);
    poolWrap.appendChild(filterRowInner);

    var heroScroll = buildHeroScroll();
    poolWrap.appendChild(heroScroll);

    function refreshHeroScroll(){
      var fresh = buildHeroScroll();
      poolWrap.replaceChild(fresh, heroScroll);
      heroScroll = fresh;
      clearBtn.classList.toggle("hidden", !state.heroSearch);
    }

    searchInput.oninput = function(){
      state.heroSearch = this.value;
      refreshHeroScroll();
    };
    clearBtn.onclick = function(){
      state.heroSearch = "";
      searchInput.value = "";
      refreshHeroScroll();
      searchInput.focus();
    };

    grid.appendChild(poolWrap);

    var rosterB = el("div", "roster b");
    rosterB.appendChild(el("h3", "", state.teamB));
    for(var j=0;j<state.picksPerTeam;j++){
      rosterB.appendChild(buildRosterSlot("b", j, g.picksB[j]));
    }
    grid.appendChild(rosterB);

    container.appendChild(grid);

    if(state.phase === "result"){
      var rb = el("div", "result-bar");
      rb.appendChild(el("div", "msg", "Draft complete for Game " + g.n + ". Declare the winner to show the next game."));
      var actions = el("div", "result-actions");
      var winA = el("button", "btn next-game", state.teamA + " wins — Next game");
      winA.onclick = function(){ declareWinner("a"); };
      var winB = el("button", "btn next-game b", state.teamB + " wins — Next game");
      winB.onclick = function(){ declareWinner("b"); };
      actions.appendChild(winA);
      actions.appendChild(winB);
      rb.appendChild(actions);
      container.appendChild(rb);
    }

    return container;
  }

  function renderUnavailableStrip(){
    var wrap = el("div", "unavailable-strip");
    var names = Object.keys(state.unavailable);
    wrap.appendChild(el("h4", "", "Locked heroes (" + names.length + ")"));
    if(names.length === 0){
      wrap.appendChild(el("div", "", "None yet."));
    } else {
      var row = el("div", "chip-row");
      names.forEach(function(n){
        if(!HERO_ICONS[n]) return;
        var icon = document.createElement("img");
        icon.className = "locked-hero-icon";
        icon.src = HERO_ICONS[n];
        icon.alt = n;
        icon.title = n;
        icon.setAttribute("aria-label", n);
        icon.onerror = function(){ this.remove(); };
        row.appendChild(icon);
      });
      wrap.appendChild(row);
    }
    return wrap;
  }

  function renderWinnerBanner(){
    var winnerSide = state.score.a > state.score.b ? "a" : "b";
    var winnerName = winnerSide === "a" ? state.teamA : state.teamB;
    var wrap = el("div", "winner-banner");
    wrap.appendChild(el("div", "eyebrow", FORMATS[state.format].label + " match winner"));
    wrap.appendChild(el("div", "name", winnerName));
    wrap.appendChild(el("div", "final", "Final score " + state.score.a + " – " + state.score.b +
      " across " + state.games.length + " games"));
    return wrap;
  }

  state = freshState();
  render();
})();
</script>
</body>
</html>
